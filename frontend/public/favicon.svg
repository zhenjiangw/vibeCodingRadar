<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>
  <!-- background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#g)" rx="8"/>
  <!-- radar arcs -->
  <path d="M32 10 A22 22 0 0 1 54 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M32 16 A16 16 0 0 1 48 32" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M32 22 A10 10 0 0 1 42 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="3" fill="#fff"/>
  <!-- sweep line -->
  <line x1="32" y1="32" x2="48" y2="22" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="3s" repeatCount="indefinite"/>
  </line>
  <!-- code brackets -->
  <path d="M20 24 l-4 8 4 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M44 24 l4 8-4 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
